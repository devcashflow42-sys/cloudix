# ==============================================================
#  Cloudix Edge - Configuración de Cloudflare Pages Functions
# ==============================================================
name = "cloudix-edge"
compatibility_date = "2024-09-23"

# Habilita las APIs de Node necesarias por @neondatabase/serverless y jose.
compatibility_flags = ["nodejs_compat"]

# Carpeta con los archivos estáticos que sirve Cloudflare Pages.
# (Esto es lo que faltaba: sin un directorio de salida, el deploy falla con
#  "Could not detect a directory containing static files".)
pages_build_output_dir = "public"

# --------------------------------------------------------------
# Variables NO secretas. Las secretas (DATABASE_URL, JWT_SECRET...)
# se definen con `wrangler pages secret put <NOMBRE>` o en el panel,
# y en local con el archivo .dev.vars (ver .dev.vars.example).
# --------------------------------------------------------------
[vars]
APP_NAME = "Cloudix"
API_VERSION = "1.0.0"
JWT_ISSUER = "cloudix"
JWT_AUDIENCE = "cloudix-clients"
ACCESS_TOKEN_TTL = "900"          # 15 min (segundos)
REFRESH_TOKEN_TTL = "2592000"     # 30 días (segundos)
CORS_ORIGIN = "*"

# --------------------------------------------------------------
# Almacenamiento de archivos en Cloudflare R2 (para /upload).
# Crea el bucket con: wrangler r2 bucket create cloudix-media
# y descomenta el binding:
# --------------------------------------------------------------
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "cloudix-media"

# --------------------------------------------------------------
# Ejemplo de KV para rate limiting / caché (opcional):
# --------------------------------------------------------------
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<tu-kv-namespace-id>"
